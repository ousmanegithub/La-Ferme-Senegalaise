# Render Blueprint: lets Render provision the web service + database in one
# step ("New +" -> "Blueprint", pointing at this repo) instead of
# configuring each setting by hand. See README "Mise en ligne rapide
# (relecture client)" for the full walkthrough.
#
# Secrets are deliberately NOT written here (this file is committed to
# git): SECRET_KEY is auto-generated by Render, DATABASE_URL is wired
# automatically from the database below, and MAPTILER_API_KEY is left for
# you to paste into the Render dashboard after the first deploy.
services:
  - type: web
    name: ferme-senegalaise
    runtime: docker
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: fermesenegalaise.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ferme-senegalaise.onrender.com
      - key: BASE_URL
        value: https://ferme-senegalaise.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://ferme-senegalaise.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ferme-senegalaise-db
          property: connectionString
      - key: MAPTILER_API_KEY
        sync: false
      - key: CONTACT_FORM_RECIPIENT_EMAIL
        sync: false
      # Bootstraps the first admin account automatically at container boot
      # (see core/management/commands/ensure_superuser.py) — the free plan
      # has no Shell/Jobs to run `createsuperuser` by hand. Pick a real
      # password here; it's only used once, the account then lives in the
      # database like any other.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: ferme-senegalaise-db
    plan: free
